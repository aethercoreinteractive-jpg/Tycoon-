<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liberty City 3D - Open World Action</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .hud-panel {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mission-toast {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden relative">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- HUD Overlay -->
    <div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 md:p-6">

        <!-- Top Header: Cash, Wanted Level, Radar Mini-Info -->
        <header class="w-full flex items-center justify-between pointer-events-auto">
            <!-- Wanted Stars -->
            <div id="wanted-stars" class="hud-panel px-4 py-2 rounded-2xl flex items-center space-x-1.5 shadow-2xl border border-amber-500/40">
                <span class="text-xs font-bold text-slate-300 mr-2 uppercase tracking-wider">Wanted</span>
                <i class="fa-solid fa-star text-amber-500 text-sm"></i>
                <i class="fa-solid fa-star text-slate-600 text-sm"></i>
                <i class="fa-solid fa-star text-slate-600 text-sm"></i>
            </div>

            <!-- Cash & Health -->
            <div class="flex items-center space-x-4">
                <div class="hud-panel px-5 py-2 rounded-2xl flex items-center space-x-2 shadow-2xl border border-emerald-500/30">
                    <span class="text-emerald-400 font-bold">$</span>
                    <span id="stat-money" class="font-extrabold text-lg text-emerald-300">25,000</span>
                </div>
                <div class="hud-panel px-5 py-2 rounded-2xl flex items-center space-x-2 shadow-2xl border border-red-500/30">
                    <i class="fa-solid fa-heart text-red-500"></i>
                    <span id="stat-health" class="font-extrabold text-lg text-red-300">100</span>
                </div>
            </div>
        </header>

        <!-- Center Notification Toast -->
        <div id="toast-container" class="absolute top-24 left-1/2 -translate-x-1/2 z-30 flex flex-col space-y-2 pointer-events-none max-w-sm w-full text-center"></div>

        <!-- Controls Guide / Action Prompt -->
        <div class="absolute bottom-28 left-1/2 -translate-x-1/2 hud-panel px-6 py-2.5 rounded-2xl pointer-events-auto shadow-2xl border border-blue-500/40 text-center">
            <span id="action-prompt" class="text-xs md:text-sm font-bold text-blue-200">Use <b class="text-white">WASD / Arrow Keys</b> to Move & Drive | Press <b class="text-white">F</b> to Enter/Exit Vehicle</span>
        </div>

        <!-- Bottom Controls Bar (Virtual D-Pad & Actions for Mobile/PC) -->
        <footer class="w-full flex items-center justify-between pointer-events-auto">
            <div class="flex items-center space-x-2 hud-panel p-3 rounded-2xl">
                <div class="grid grid-cols-3 gap-1 w-32 h-24">
                    <div></div>
                    <button onclick="Game.movePlayer('UP')" class="bg-slate-800 hover:bg-slate-700 rounded-xl text-white font-bold flex items-center justify-center active:bg-blue-600"><i class="fa-solid fa-chevron-up"></i></button>
                    <div></div>
                    <button onclick="Game.movePlayer('LEFT')" class="bg-slate-800 hover:bg-slate-700 rounded-xl text-white font-bold flex items-center justify-center active:bg-blue-600"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="Game.movePlayer('DOWN')" class="bg-slate-800 hover:bg-slate-700 rounded-xl text-white font-bold flex items-center justify-center active:bg-blue-600"><i class="fa-solid fa-chevron-down"></i></button>
                    <button onclick="Game.movePlayer('RIGHT')" class="bg-slate-800 hover:bg-slate-700 rounded-xl text-white font-bold flex items-center justify-center active:bg-blue-600"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="flex items-center space-x-3 hud-panel p-3 rounded-2xl">
                <button onclick="Game.toggleVehicle()" class="px-5 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs shadow-lg shadow-blue-500/30 flex items-center space-x-2">
                    <i class="fa-solid fa-car text-base"></i>
                    <span id="veh-btn-text">ENTER CAR (F)</span>
                </button>
                <button onclick="Game.playerPunch()" class="px-5 py-4 rounded-xl bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs shadow-lg shadow-red-500/30 flex items-center space-x-2">
                    <i class="fa-solid fa-hand-fist text-base"></i>
                    <span>ACTION</span>
                </button>
            </div>
        </footer>

    </div>

    <!-- Intro Welcome Modal -->
    <div id="intro-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="hud-panel w-full max-w-lg rounded-3xl p-8 modal-animation border border-blue-500/40 text-center space-y-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center mx-auto shadow-2xl shadow-blue-500/50 text-2xl text-white">
                <i class="fa-solid fa-city"></i>
            </div>
            <div>
                <h2 class="text-2xl font-extrabold text-slate-100 mb-2">Liberty City 3D</h2>
                <p class="text-sm text-slate-300 leading-relaxed">Welcome to the underworld. Explore the 3D open-world city, steal sports cars, avoid the police, and complete underground missions!</p>
            </div>
            <button onclick="Game.closeIntro()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 font-extrabold text-white text-sm shadow-xl shadow-blue-600/40 transition-all transform active:scale-95">
                ENTER CITY <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        /**
         * Liberty City 3D - Open World Action Engine (GTA 3 Style)
         */

        const Game = {
            money: 25000,
            health: 100,
            inVehicle: false,
            keys: {},

            init() {
                World3D.init();
                this.setupKeyboard();
                this.updateHUD();
            },

            closeIntro() {
                document.getElementById('intro-modal').classList.add('hidden');
            },

            toggleVehicle() {
                this.inVehicle = !this.inVehicle;
                const btnText = document.getElementById('veh-btn-text');
                if (this.inVehicle) {
                    btnText.innerText = "EXIT CAR (F)";
                    this.showToast("Entered Sports Cruiser!", "success");
                } else {
                    btnText.innerText = "ENTER CAR (F)";
                    this.showToast("Exited vehicle.", "info");
                }
            },

            playerPunch() {
                this.showToast("Punch / Attack executed!", "info");
            },

            movePlayer(dir) {
                World3D.moveCharacter(dir);
            },

            setupKeyboard() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.key.toLowerCase()] = true;
                    if (e.key.toLowerCase() === 'f') {
                        this.toggleVehicle();
                    }
                });
                window.addEventListener('keyup', (e) => {
                    this.keys[e.key.toLowerCase()] = false;
                });
            },

            updateHUD() {
                document.getElementById('stat-money').innerText = this.money.toLocaleString('en-IN');
                document.getElementById('stat-health').innerText = this.health;
            },

            showToast(text, type = 'info') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `hud-panel px-4 py-2.5 rounded-2xl text-xs font-bold text-slate-100 shadow-2xl mission-toast border border-blue-500/40`;
                toast.innerText = text;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        };

        // --- 3D OPEN WORLD RENDERER (Three.js) ---
        const World3D = {
            scene: null,
            camera: null,
            renderer: null,
            controls: null,
            playerMesh: null,
            carMesh: null,
            playerPos: { x: 0, z: 0 },
            carPos: { x: 5, z: 5 },

            init() {
                const container = document.getElementById('canvas-container');

                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0b0f19);
                this.scene.fog = new THREE.FogExp2(0x0b0f19, 0.015);

                const aspect = window.innerWidth / window.innerHeight;
                this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
                this.camera.position.set(0, 15, 20);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(this.renderer.domElement);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x94a3b8, 0.8);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.4);
                dirLight.position.set(20, 40, 20);
                dirLight.castShadow = true;
                this.scene.add(dirLight);

                this.buildCity();
                this.buildPlayerAndCar();

                let lastTime = performance.now();
                const loop = (currentTime) => {
                    const dt = (currentTime - lastTime) / 1000;
                    lastTime = currentTime;
                    this.update(dt);
                    requestAnimationFrame(loop);
                };
                requestAnimationFrame(loop);
            },

            buildCity() {
                // Asphalt Street Grid
                const groundGeo = new THREE.PlaneGeometry(120, 120);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
                const ground = new THREE.Mesh(groundGeo, groundMat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Procedural City Skyscrapers
                const buildingMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4, metalness: 0.6 });
                const positions = [
                    {-15, -15}, {15, -15}, {-15, 15}, {15, 15},
                    {-30, -30}, {30, -30}, {-30, 30}, {30, 30},
                    {0, -35}, {0, 35}, {-35, 0}, {35, 0}
                ];

                positions.forEach((pos, i) => {
                    const h = Math.random() * 15 + 10;
                    const bGeo = new THREE.BoxGeometry(8, h, 8);
                    const bMesh = new THREE.Mesh(bGeo, buildingMat);
                    bMesh.position.set(pos.x, h / 2, pos.y);
                    bMesh.castShadow = true; bMesh.receiveShadow = true;
                    this.scene.add(bMesh);
                });
            },

            buildPlayerAndCar() {
                // Player Avatar (GTA 3 Claude Style)
                const pMat = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.5 });
                this.playerMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.6, 12), pMat);
                this.playerMesh.position.set(0, 0.8, 0);
                this.playerMesh.castShadow = true;
                this.scene.add(this.playerMesh);

                // Sports Car
                const carMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.2, metalness: 0.9 });
                this.carMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4), carMat);
                this.carMesh.position.set(5, 0.5, 5);
                this.carMesh.castShadow = true;
                this.scene.add(this.carMesh);
            },

            movePlayer(dir) {
                const speed = 1.5;
                if (dir === 'UP') this.playerPos.z -= speed;
                if (dir === 'DOWN') this.playerPos.z += speed;
                if (dir === 'LEFT') this.playerPos.x -= speed;
                if (dir === 'RIGHT') this.playerPos.x += speed;
            },

            update(dt) {
                const speed = 4 * dt;
                if (Game.keys['w'] || Game.keys['arrowup']) this.playerPos.z -= speed;
                if (Game.keys['s'] || Game.keys['arrowdown']) this.playerPos.z += speed;
                if (Game.keys['a'] || Game.keys['arrowleft']) this.playerPos.x -= speed;
                if (Game.keys['d'] || Game.keys['arrowright']) this.playerPos.x += speed;

                if (this.playerMesh) {
                    this.playerMesh.position.x = this.playerPos.x;
                    this.playerMesh.position.z = this.playerPos.z;

                    if (Game.inVehicle && this.carMesh) {
                        this.carMesh.position.x = this.playerPos.x + 1;
                        this.carMesh.position.z = this.playerPos.z;
                        this.camera.position.set(this.carMesh.position.x, this.carMesh.position.y + 8, this.carMesh.position.z + 12);
                        this.camera.lookAt(this.carMesh.position);
                    } else {
                        this.camera.position.set(this.playerMesh.position.x, this.playerMesh.position.y + 6, this.playerMesh.position.z + 10);
                        this.camera.lookAt(this.playerMesh.position);
                    }
                }

                if (this.renderer && this.scene && this.camera) {
                    this.renderer.render(this.scene, this.camera);
                }
            },

            onWindowResize() {
                if (!this.camera || !this.renderer) return;
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        };

        window.addEventListener('DOMContentLoaded', () => { Game.init(); });
        window.addEventListener('resize', () => { World3D.onWindowResize(); });
    </script>
</body>
</html>
